<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机房 IPv4 地址池</title>
<style>
  :root { --green:#2e7d32; --amber:#f9a825; --blue:#1565c0; --gray:#90a4ae; }
  * { box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
         margin: 0; background: #f4f6f8; color: #263238; }
  header { background: #10243e; color: #fff; padding: 14px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  header small { color: #9fb3c8; }
  main { max-width: 1080px; margin: 20px auto; padding: 0 16px;
         display: grid; gap: 16px; }
  section { background: #fff; border-radius: 10px; padding: 16px 20px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h2 { margin: 0 0 12px; font-size: 16px; }
  input { padding: 7px 10px; border: 1px solid #b0bec5; border-radius: 6px;
          font-size: 14px; }
  button { padding: 7px 14px; border: 0; border-radius: 6px; cursor: pointer;
           background: #1565c0; color: #fff; font-size: 14px; }
  button:hover { filter: brightness(1.1); }
  button.warn { background: #c62828; }
  button.ghost { background: #607d8b; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .msg { margin-top: 10px; padding: 8px 12px; border-radius: 6px; font-size: 13px;
         white-space: pre-wrap; word-break: break-all; display: none; }
  .msg.ok  { display: block; background: #e8f5e9; color: var(--green); }
  .msg.err { display: block; background: #ffebee; color: #c62828; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 10px; }
  .chip { border-radius: 8px; padding: 10px; font-size: 13px; border: 1px solid #cfd8dc;
          background: #eceff1; line-height: 1.5; }
  .chip b { font-size: 14px; }
  .chip.free     { background: #e8f5e9; border-color: #a5d6a7; }
  .chip.reserved { background: #fff8e1; border-color: #ffe082; }
  .chip.leased   { background: #e3f2fd; border-color: #90caf9; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; color: #fff;
         font-size: 12px; }
  .tag.free     { background: var(--green); }
  .tag.reserved { background: var(--amber); }
  .tag.leased   { background: var(--blue); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 5px 8px; border-bottom: 1px solid #eceff1; text-align: left; }
  th { color: #78909c; font-weight: 600; }
  .muted { color: #78909c; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>机房 IPv4 地址池 <small>申请 → 30 秒确认 → 5 分钟租约 → 续租 / 释放</small></h1>
</header>
<main>
  <section>
    <h2>① 地址范围(运维设置, 最多 32 个连续地址)</h2>
    <div class="row">
      <label>起始地址 <input id="baseIp" placeholder="192.168.10.100" size="16"></label>
      <label>数量 <input id="count" type="number" min="1" max="32" value="8" style="width:70px"></label>
      <button onclick="savePool()">保存范围</button>
      <span id="rangeInfo" class="muted">加载中…</span>
    </div>
    <div id="poolMsg" class="msg"></div>
  </section>

  <section>
    <h2>② 地址占用状态(每 2 秒自动刷新)</h2>
    <div id="grid"></div>
  </section>

  <section>
    <h2>③ 设备模拟(申请 / 确认 / 续租 / 释放)</h2>
    <div class="row">
      <label>设备 ID <input id="deviceId" placeholder="server-01" size="14"></label>
      <button onclick="doApply()">申请地址</button>
      <button onclick="doConfirm()" class="ghost">确认租约</button>
      <button onclick="doRenew()" class="ghost">续租 5 分钟</button>
      <button onclick="doRelease()" class="warn">释放</button>
    </div>
    <div id="simMsg" class="msg"></div>
  </section>

  <section>
    <h2>④ 最近分配记录</h2>
    <table>
      <thead><tr><th>#</th><th>地址</th><th>设备</th><th>状态</th><th>预留截止</th><th>租约截止</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
  </section>
</main>

<script>
let lastApply = null;   // 最近一次申请结果 {address, code}

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || (r.status + ' ' + r.statusText));
  return j;
}

function show(id, text, ok) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}

const fmt = ts => ts ? new Date(ts * 1000).toLocaleTimeString() : '-';
const stateText = {reserved: '预留中', leased: '租约中', released: '已释放',
                   expired: '已过期', free: '空闲'};

async function refresh() {
  try {
    const p = await api('/api/pool');
    document.getElementById('rangeInfo').textContent = p.configured
      ? `当前范围: ${p.config.base_ip} — ${p.config.last_ip} (共 ${p.config.count} 个)`
      : '尚未配置地址范围';
    if (p.configured && !document.getElementById('baseIp').value) {
      document.getElementById('baseIp').value = p.config.base_ip;
      document.getElementById('count').value = p.config.count;
    }
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (const a of p.addresses) {
      const div = document.createElement('div');
      div.className = 'chip ' + a.status;
      let extra = '';
      if (a.status === 'reserved')
        extra = `${a.device_id}<br>确认剩余 ${Math.ceil(a.remaining)} 秒`;
      else if (a.status === 'leased')
        extra = `${a.device_id}<br>租约剩余 ${Math.ceil(a.remaining)} 秒`;
      div.innerHTML = `<b>${a.address}</b><br>` +
        `<span class="tag ${a.status}">${stateText[a.status]}</span><br>` +
        `<small>${extra}</small>`;
      grid.appendChild(div);
    }
    document.getElementById('history').innerHTML = p.recent.map(r =>
      `<tr><td>${r.id}</td><td>${r.address}</td><td>${r.device_id}</td>` +
      `<td>${stateText[r.state] || r.state}</td>` +
      `<td>${fmt(r.reserved_until)}</td><td>${fmt(r.lease_until)}</td></tr>`
    ).join('');
  } catch (e) { /* 刷新失败下轮再试 */ }
}

async function savePool() {
  try {
    const j = await api('/api/pool', {
      base_ip: document.getElementById('baseIp').value.trim(),
      count: Number(document.getElementById('count').value),
    });
    show('poolMsg', '已保存: ' + j.range, true);
    refresh();
  } catch (e) { show('poolMsg', '保存失败: ' + e.message, false); }
}

function deviceId() {
  const d = document.getElementById('deviceId').value.trim();
  if (!d) throw new Error('请先填写设备 ID');
  return d;
}

async function doApply() {
  try {
    const j = await api('/api/apply', {device_id: deviceId()});
    lastApply = j;
    show('simMsg', j.state === 'reserved'
      ? `已预留 ${j.address}\n确认码: ${j.code}  (${Math.ceil(j.confirm_remaining)} 秒内确认)` +
        (j.reused_existing ? '\n(该设备已有预留, 返回原分配)' : '')
      : `该设备已持有租约 ${j.address} (剩余 ${Math.ceil(j.lease_remaining)} 秒)`, true);
    refresh();
  } catch (e) { show('simMsg', '申请失败: ' + e.message, false); }
}

async function doConfirm() {
  try {
    if (!lastApply || !lastApply.code) throw new Error('请先申请地址拿到确认码');
    const j = await api('/api/confirm', {
      device_id: deviceId(), address: lastApply.address, code: lastApply.code});
    show('simMsg', `租约生效: ${j.address}, 5 分钟内有效`, true);
    lastApply = {address: j.address};
    refresh();
  } catch (e) { show('simMsg', '确认失败: ' + e.message, false); }
}

async function doRenew() {
  try {
    if (!lastApply) throw new Error('请先申请地址');
    const j = await api('/api/renew', {device_id: deviceId(), address: lastApply.address});
    show('simMsg', `已续租: ${j.address}, 剩余 ${Math.ceil(j.lease_remaining)} 秒`, true);
    refresh();
  } catch (e) { show('simMsg', '续租失败: ' + e.message, false); }
}

async function doRelease() {
  try {
    if (!lastApply) throw new Error('请先申请地址');
    const j = await api('/api/release', {device_id: deviceId(), address: lastApply.address});
    show('simMsg', `已释放: ${j.address}`, true);
    lastApply = null;
    refresh();
  } catch (e) { show('simMsg', '释放失败: ' + e.message, false); }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
